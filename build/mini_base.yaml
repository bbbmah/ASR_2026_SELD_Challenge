# [변경 이력 시작]
#   2026-10-03  최초 생성(복사한 날짜 기준): 소규모 시험용 설정(epochs 1, batch_size 2, num_workers 0)
#   2026-10-07  새 base.yaml(추가 학습 데이터 항목 포함)에서 다시 만듦
#   2026-10-07  변경 이력 주석 추가
# [변경 이력 끝]
# 모든 설정과 기본값. 코랩에서는 노트북의 '설정 칸'이 이 값을 덮어쓴다.
# 명령줄에서는 --set key=value 로 어떤 값이든 바꿀 수 있다. (예: --set seed=2 --set lr=0.0005)

# ---------------- 위치 ----------------
drive_root:                      # [필수] 드라이브의 프로젝트 폴더. 안에 dataset/ 와 internal/ 이 있어야 한다. 예: /content/drive/MyDrive/Colab Notebooks/ASR_2026-2/for_dataset
out_root:                        # 결과, 체크포인트, 특징 캐시를 저장할 곳. 비우면 {drive_root}/seld_runs
data_root: /content/data         # 코랩 로컬로 풀어 둘 데이터 위치 (세션이 끝나면 사라지므로 prepare 를 다시 하면 된다)
local_tmp: /content/tmp          # 에폭마다 만드는 임시 예측 csv 위치 (로컬 디스크)
public_zip_dir:                  # main20 공개 zip(train.zip 등)이 있는 곳. 비우면 {drive_root}/dataset/main20
internal_zip_dir:                # ctrl5/fix20 내부 zip이 있는 곳. 비우면 {drive_root}/internal

# ---------------- 무엇을 돌릴까 ----------------
dataset: main20                  # 학습 데이터셋: main20 | ctrl5   (fix20 은 train 이 없어 평가용으로만 쓴다: eval_dataset)
eval_dataset:                    # 평가할 데이터셋. 비우면 dataset 과 같다. 예: ctrl5 로 학습한 모델을 fix20 val 로 평가
preset: B2                       # B1 | B2 | B2-0 | B3  (아래 개별 옵션이 비어 있으면 프리셋 값을 쓴다)
                                 #   B1   = 소리만 쓰는 원래 모델
                                 #   B2   = 영상+소리 원래 모델 (video_input=real, video_crop=center, av_time_window=none)
                                 #   B2-0 = B2 와 같은 구조에서 영상을 0 으로 채운 대조군 (video_input=zeros)
                                 #   B3   = B2 + 화면 전체 사용(video_crop=full) + 시간 창 제한(av_time_window=2)

# ---------------- 모델 옵션 (비워 두면 프리셋 값) ----------------
modality:                        # audio | audio_visual
video_input:                     # real | zeros   (zeros: 학습과 평가 모두 영상 특징을 0으로)
video_crop:                      # center | full  (center: 원래 전처리, 가운데만 사용. full: 화면 전체를 224x448 로 줄여 사용)
av_time_window:                  # none | 정수 k  (k 이면 오디오 프레임 t 가 영상 프레임 t-k~t+k 만 봄)

# ---------------- 학습 ----------------
seed: 1                          # 난수 시드
epochs: 1                      # 에폭 수
lr: 0.001                        # 학습률
batch_size: 2                 # auto = 12800 / 라벨 프레임 수 (main20 64, ctrl5 256). 숫자를 쓰면 그 값. GPU 메모리가 모자라면 줄인다
num_workers: 0                   # 데이터 로더 프로세스 수
select_metric: F_ext             # 가장 좋은 모델을 고르는 기준 (val 점수): F_ext(방위각 접지 않음) | F_basic(접음)
exclude_absent_classes: true     # 정답이 하나도 없는 클래스를 평균 F 에서 뺀다 (val 에는 9번 악기, 11번 종 정답이 없다)
resume: true                     # true 이면 끊긴 곳부터 이어 한다
updates:                         # 비우면 epochs 를 쓴다. 숫자(예: 9200)면 "총 갱신 횟수"로 학습 길이를 정한다: 에폭 수 = 올림(updates / 에폭당 갱신 횟수).
                                 #   데이터 양이 다른 실행을 같은 갱신 횟수로 비교할 때 쓴다 (기존 main20 학습 = 46회 x 200에폭 = 9200회)
audio_dtype: float32             # float32 | float16. 램이 모자랄 때 float16 (오디오 특징 메모리가 절반, 값은 소수 셋째 자리 이하가 달라질 수 있음)

# ---------------- 추가 학습 데이터 (colab_generate.ipynb 가 만든 S1 등) ----------------
generated_dir:                   # 추가 생성 데이터가 있는 곳. 비우면 {drive_root}/generated  (안에 s1/ 폴더, s1_main20_train_p000.zip ...)
train_stages: 0                  # 학습에 쓸 데이터 단계: 0 = 기존 데이터(S0), "0,1" = S0+S1, "1" = S1만
train_family:                    # (단계 1 이상에만 적용) 카메라 궤적 가족 필터. 예: F1 또는 F1,F4. 비우면 전부. F1 = 챌린지 정의(sweep)
train_mirror:                    # (단계 1 이상에만 적용) 1 = 좌우 거울 클립만, 0 = 거울이 아닌 것만. 비우면 둘 다
train_fraction: 1.0              # (단계 1 이상에만 적용) 창의 무작위 일부만 쓴다 (0~1, 학습 곡선 실험용). main20 과 ctrl5 는 같은 창을 고른다

# ---------------- 평가 ----------------
eval_video: real                 # real | zeros | shuffle  (평가 때만 영상을 바꾼다. shuffle = 다른 클립의 영상을 넣는다)
exclude_list:                    # 채점에서 뺄 클립 이름 목록 파일. 예: configs/exclude_val_fix20.txt (fix20 에서 빠진 val_00088)
